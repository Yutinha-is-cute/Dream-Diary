name: Dream Diary APK (read-only)

on:
  push:
    branches: [arena/be4b9df4-dream-diary]
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: dream-diary-apk-${{ github.ref }}
  cancel-in-progress: true

jobs:
  build-apk:
    name: Build production ARM64 APK
    runs-on: ubuntu-latest
    timeout-minutes: 90
    steps:
      - uses: actions/checkout@v4
        with:
          lfs: false
          persist-credentials: false

      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '21'

      - name: Flutter pin
        id: flutter
        run: echo "version=$(jq -r .flutter .fvmrc)" >> "$GITHUB_OUTPUT"

      - uses: subosito/flutter-action@v2
        with:
          flutter-version: ${{ steps.flutter.outputs.version }}

      - uses: dtolnay/rust-toolchain@master
        with:
          toolchain: '1.99.1'

      - uses: actions/setup-node@v4
        with:
          node-version: '24'

      - run: corepack enable

      - name: Bootstrap pinned Pub workspace
        run: |
          set -o pipefail
          dart pub global activate melos 8.2.2
          echo "$HOME/.pub-cache/bin" >> "$GITHUB_PATH"
          flutter pub get 2>&1 | tee bootstrap.log

      - uses: taiki-e/install-action@v2
        with:
          tool: cargo-about@0.9.2

      - uses: nttld/setup-ndk@v1
        id: ndk
        with:
          ndk-version: r28c
          link-to-sdk: true

      - name: Build installable ARM64 APK (local debug signing only)
        working-directory: mobile
        env:
          ANDROID_NDK_HOME: ${{ steps.ndk.outputs.ndk-path }}
        run: |
          set -o pipefail
          flutter build apk --flavor production --release --target-platform android-arm64 --obfuscate --split-debug-info=splitMap 2>&1 | tee ../build-apk.log

      - name: Verify APK and record exact commit
        run: |
          set -e
          apk=mobile/build/app/outputs/flutter-apk/app-production-release.apk
          test -f "$apk"
          ls -lh "$apk"
          sha256sum "$apk" | tee apk-sha256.txt
          printf '%s\n' "$GITHUB_SHA" > apk-commit.txt
          cat apk-commit.txt

      - uses: actions/upload-artifact@v4
        with:
          name: dream-diary-arm64-apk
          path: |
            mobile/build/app/outputs/flutter-apk/app-production-release.apk
            mobile/splitMap/
            apk-sha256.txt
            apk-commit.txt
          if-no-files-found: error

      - name: Upload build logs
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: dream-diary-apk-logs
          path: |
            bootstrap.log
            build-apk.log
          if-no-files-found: ignore
